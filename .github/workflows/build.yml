name: Build app image

# Builds and publishes a multi-arch prebuilt image to GHCR so users who install
# from the repository don't have to build the (Debian + Node SDK + …) image on
# their own hardware. The image is tagged with the app version from
# config.yaml, plus `latest`.
#
# RELEASING: the version in config.yaml is what publishes. Home Assistant reads
# that value straight off master to decide whether an update is available, so it
# must always name an image that actually exists in GHCR. This workflow runs on
# every push touching the app but only *publishes* when config.yaml carries a
# version that hasn't been published yet — ordinary commits are a no-op, and a
# release is a deliberate version bump. See claude-code-ui/CLAUDE.md § Releasing.
on:
  push:
    branches: [master]
    paths:
      - "claude-code-ui/**"
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild and overwrite the image even if this version is already published"
        type: boolean
        default: false

env:
  ARCHITECTURES: '["amd64", "aarch64"]'
  IMAGE_NAME: claude-code-ui
  BUILDER_VERSION: "2026.06.0"

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: claude-code-ui/package-lock.json
      - name: Install dev dependencies
        working-directory: claude-code-ui
        run: npm ci
      - name: Unit, server integration and CLI tests
        working-directory: claude-code-ui
        run: npm test

  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    # Advisory: a headless-Chrome failure should not block a release on its own.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: claude-code-ui/package-lock.json
      - name: Install dev dependencies
        working-directory: claude-code-ui
        run: npm ci
      - name: Run the UI in headless Chrome
        working-directory: claude-code-ui
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: npm run test:browser

  version:
    name: Resolve app version
    runs-on: ubuntu-latest
    # A failing test must not publish an image users will be told to update to.
    needs: test
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          FORCE: ${{ inputs.force }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep '^version:' claude-code-ui/config.yaml | head -1 | cut -d'"' -f2)
          IMAGE="ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "App version: ${VERSION}"

          echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

          # A published version is immutable — an ordinary commit must never
          # silently replace the image users already installed. Publish only
          # when config.yaml names a version GHCR doesn't have yet.
          if [ "${FORCE}" = "true" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Forced rebuild of ${VERSION}."
          elif docker manifest inspect "${IMAGE}:${VERSION}" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Version ${VERSION} is already published — skipping. Bump the version in config.yaml to cut a release."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Releasing ${VERSION}."
          fi

  init:
    name: Prepare build matrix
    needs: version
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@2026.06.0
        with:
          architectures: ${{ env.ARCHITECTURES }}
          image-name: ${{ env.IMAGE_NAME }}
          registry-prefix: ghcr.io/${{ github.repository_owner }}

  build:
    name: Build ${{ matrix.arch }}
    needs: [version, init]
    if: needs.version.outputs.publish == 'true'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.init.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Build and push ${{ matrix.arch }} image
        uses: home-assistant/builder/actions/build-image@2026.06.0
        with:
          arch: ${{ matrix.arch }}
          context: claude-code-ui
          image: ${{ matrix.image }}
          version: ${{ needs.version.outputs.version }}
          image-tags: |
            ${{ needs.version.outputs.version }}
            latest
          # The new builder doesn't read build.yaml, so pass the app base image.
          build-args: |
            BUILD_FROM=ghcr.io/home-assistant/${{ matrix.arch }}-base-debian:bookworm
          push: "true"
          cosign: "false"
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}

  manifest:
    name: Publish multi-arch manifest
    needs: [version, init, build]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Publish manifest
        uses: home-assistant/builder/actions/publish-multi-arch-manifest@2026.06.0
        with:
          architectures: ${{ env.ARCHITECTURES }}
          image-name: ${{ env.IMAGE_NAME }}
          registry-prefix: ghcr.io/${{ github.repository_owner }}
          image-tags: |
            ${{ needs.version.outputs.version }}
            latest
          cosign: "false"
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
