configuration:
  anthropic_api_key:
    name: Anthropic API key
    description: >-
      Optional — authenticate with an API key instead of the browser login. Leave
      blank to sign in from the chat UI.
  default_permission_mode:
    name: Default permission mode
    description: >-
      How tool use is approved in new chats (Ask, Plan, Auto, Accept edits, or
      Bypass). You can still change it per-chat.
  ha_smart_context:
    name: Home Assistant smart context
    description: >-
      Load your HA system info, entities, add-ons, and recent errors into Claude's
      context each session. Recommended on.
  allow_addon_configs:
    name: Allow access to other add-on configs
    description: >-
      Let Claude read and edit other add-ons' config folders under
      /addon_configs. Off by default; those configs may contain secrets.
  enable_esphome:
    name: ESPHome support
    description: >-
      Bundle the ESPHome CLI so Claude can validate, compile, flash, and log your
      ESPHome devices. First enable installs the toolchain in the background (a few
      minutes).
  verbose_logging:
    name: Verbose logging
    description: >-
      Write detailed per-event logs to the add-on log for diagnosing a chat that
      seems to hang. Milestone logs are always recorded.
  debug:
    name: Debug mode (dangerous)
    description: >-
      DANGEROUS — exposes unauthenticated /diag endpoints (including one that runs
      arbitrary prompts with tools auto-approved). Local debugging only.
