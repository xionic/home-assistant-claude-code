name: "Claude Code UI"
version: "1.7.2"
slug: "claude-code-ui"
# Prebuilt multi-arch image published by CI (.github/workflows/build.yml). Store
# installs pull this instead of building locally. NOTE: local dev installs must
# strip this line so the Supervisor builds from the Dockerfile (see CLAUDE.md).
image: "ghcr.io/xionic/claude-code-ui"
description: "Claude Code in your browser with Home Assistant integration and mobile-friendly chat UI."
url: "https://github.com/xionic/home-assistant-claude-code"
arch:
  - aarch64
  - amd64
startup: services
boot: manual
ingress: true
ingress_port: 7681
panel_icon: mdi:creation
homeassistant_api: true
auth_api: true
hassio_api: true
hassio_role: manager
map:
  - config:rw
  - all_addon_configs:rw
# Keep multi-GB, tens-of-thousands-of-files build caches out of add-on backups.
# When ESPHome compiles, ESP-IDF/PlatformIO write GBs of small files under /data;
# including them in the nightly backup caused a tiny-file IO storm that starved
# the host watchdog and hard-reset the Pi. All excluded paths are reproducible
# (rebuilt on the next compile / esphome reinstall).
backup_exclude:
  - ".cache"
  - ".cache/**"
  - "esphome/.platformio"
  - "esphome/.platformio/**"
  - "esphome/venv"
  - "esphome/venv/**"
  - ".local/share/uv"
  - ".local/share/uv/**"
options:
  anthropic_api_key: ""
  default_permission_mode: ask
  ha_smart_context: true
  allow_addon_configs: false
  enable_esphome: false
  verbose_logging: false
  debug: false
schema:
  anthropic_api_key: str?
  default_permission_mode: "list(ask|plan|auto|acceptEdits|bypass)"
  ha_smart_context: bool
  allow_addon_configs: bool
  enable_esphome: bool
  verbose_logging: bool
  debug: bool
